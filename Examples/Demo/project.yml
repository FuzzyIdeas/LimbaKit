name: LimbaDemo
options:
  bundleIdPrefix: com.lowtechguys
  deploymentTarget:
    macOS: "14.0"
packages:
  LimbaKit:
    path: ../..
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    DEVELOPMENT_LANGUAGE: en
targets:
  LimbaDemo:
    type: application
    platform: macOS
    sources:
      - path: Demo
      - path: Resources/Localizable.xcstrings
      # The protocol's one build step: ship the catalogs unprocessed in Resources/Limba.
      - path: Resources/Localizable.xcstrings
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Limba
      - path: Resources/app.json
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Limba
    dependencies:
      - package: LimbaKit
        product: LimbaKit
    settings:
      base:
        PRODUCT_NAME: Limba Demo
        PRODUCT_BUNDLE_IDENTIFIER: com.lowtechguys.LimbaDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_CFBundleDisplayName: Limba Demo
